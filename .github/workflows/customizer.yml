name: Customizer

# Builds the web customizer and publishes it on GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v4
    - uses: tomasf/Cadova/Actions/BuildCustomizer@1.1.0
    - id: deployment
      uses: actions/deploy-pages@v4
